name: Morning picks email

# The on-time 9:00 AM ET email is sent by Windows Task Scheduler on the home PC
# (run_morning.ps1). GitHub's schedule trigger has run 41 min to ~10 h late, so
# this scheduled run is only a fallback for days the PC was off: it skips when
# today's picks are already in picks_history.csv. The manual "Run workflow"
# button always sends.

on:
  schedule:
    # 14:17 UTC = 10:17 AM EDT (summer) / 9:17 AM EST (winter), Mon-Fri.
    # Off the top of the hour, when GitHub's scheduler is least congested.
    - cron: "17 14 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button — trigger anytime from the GitHub app

permissions:
  contents: write

concurrency:
  group: stock-agent
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip if the 9:00 AM ET local run already sent today's picks
        id: guard
        run: |
          today=$(TZ=America/New_York date +%F)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && grep -q "^${today}," picks_history.csv; then
            echo "Picks for $today were already sent by the local 9:00 AM ET run; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run screen and send picks email
        if: steps.guard.outputs.skip != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python stock_agent.py

      - name: Commit updated data and dashboard
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "stock-agent"
          git config user.email "actions@users.noreply.github.com"
          git add picks_history.csv benchmark_history.csv dashboard.html index.html
          git diff --cached --quiet || git commit -m "Morning picks $(TZ=America/New_York date +%F)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
